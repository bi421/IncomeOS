name: IncomeOS Tests

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Build repository evidence fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/github_repos
          for repo in ResearchOS fb-planner-audit reelautofly trader true-roas-complete; do
            gh repo clone "bi421/$repo" "data/github_repos/$repo" -- --depth 1
          done

      - name: Run test suite
        run: python -m pytest -q
